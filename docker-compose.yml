services:
  mysql:
    build: docker/mysql
    container_name: gilwell-syria-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gilwell_syria
      MYSQL_USER: gilwell_syria
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost -u root --password=root --silent
      interval: 2s
      timeout: 5s
      retries: 30

  php:
    build: docker/php
    container_name: gilwell-syria-php
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    depends_on:
      mysql:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  mysql_data:
